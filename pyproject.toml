[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "funworker"
description = "轻量级线程流水线框架：生产者/处理单元/消费者通过队列解耦，多线程处理一键包装"
readme = "README.md"
version = "0.1.2"
requires-python = ">=3.10"
dependencies = ["farlog>=1.0.0"]
license = "MIT"

